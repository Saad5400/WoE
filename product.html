<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="icon" href="./assets/images/Logo.png" />
    <style>
        a.buy {
            background-color: rgba(var(--primary));
            color: rgba(var(--primary-foreground));
            font-size: 1.5rem;
            font-weight: 600;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.3s, background-color 0.3s;
        }

        a.buy:hover {
            background-color: rgba(var(--primary-foreground));
            color: rgba(var(--primary));
        }

        figure {
            transition: transform 0.3s;
        }

        figure:hover {
            transform: scale(1.1);
        }

        #description {
            max-width: 25rem;
        }
    </style>
</head>

<body>
    <main class="flex flex-col flex-md-row-reverse">
        <div>
            <figure id="activeImage" style="max-width: 15rem;">
                <img src="./assets/images/chair1.png" alt="chair" style="width: 100%;">
            </figure>
            <div class="flex justify-start gap-2">
                <figure
                    style="max-width: 2.5rem; border: 1px solid rgba(var(--primary)); border-radius: 15%; overflow: hidden; cursor: pointer;"
                    onclick="setActiveImage(this)">
                    <img id="image" src="./assets/images/chair1.png" alt="chair" style="width: 100%;">
                </figure>
                <figure style="max-width: 2.5rem; border-radius: 15%; overflow: hidden; cursor: pointer;"
                    onclick="setActiveImage(this)">
                    <video alt="chair" style="width: 100%;">
                        <source id="video" src="./assets/videos/chair1.mp4" type="video/mp4">
                    </video>
                </figure>
            </div>
        </div>
        <div class="flex flex-col justify-between items-start">
            <article style="text-align: start;">
                <h1>كرسي مكتبي</h1>
                <p id="description">الوصف: كرسي مكتبي مريح</p>
            </article>
            <div class="flex flex-col" style="width: 100%">
                <b id="price" style="width: 100%">السعر: 100$</b>
                <a href="./contact.html" style="text-align: center;" class="buy">Order Now!</a>
            </div>
        </div>
    </main>
    <script src="./assets/js/data.js" lang="javascript"></script>
    <script src="./assets/js/product.js" lang="javascript"></script>
    <script src="./assets//js/navbar.js" lang="javascript"></script>
    <script src="./assets//js/footer.js" lang="javascript"></script>
</body>

</html>
