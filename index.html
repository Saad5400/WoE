<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="icon" href="/assets/images/Logo.png">
    <style>
        img {
            width: 20vw;
        }

        .grid-container {
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 30px;
            padding: 10px;
        }

        .grid-item {
            background-color: rgba(var(--background), 0.6);
            border-radius: 20%;
            padding: 50px;
            font-size: 20px;
            text-align: left;
            /* TODO: add transition */
        }

        .grid-item p {
            color: rgba(var(--primary));
            /* TODO: add transition */
        }

        /* TODO: add grid item and grid item p hover */

        /* TODO: add media query to change grid-template-columns to 2 when screen width is less than 768px */
        /* TODO: add media query to change grid-template-columns to 1 when screen width is less than 576px */
    </style>
</head>

<body>
    <h1>
        cyberchairs
    </h1>
    <div class="grid-container">
        <div class="grid-item"><a href="product.html?id=1">
                <img src="assets/images/chair1.png" alt="chair1">
                <p>chair1</p>
                <p>$59.99</p>
            </a></div>
        <div class="grid-item"><a href="product.html?id=2">
                <img src="assets/images/chair2.png" alt="chair2">
                <p>chair2</p>
                <p>$19.99</p>
            </a></div>
        <div class="grid-item"><a href="product.html?id=3">
                <img src="assets/images/chair3.png" alt="chair3">
                <p>chair3</p>
                <p>$69.99</p>
            </a></div>
        <div class="grid-item"><a href="product.html?id=4">
                <img src="assets/images/chair4.png" alt="chair4">
                <p>chair4</p>
                <p>$65.99</p>
            </a></div>
    </div>

</body>

</html>
