<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberChair Home</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="icon" href="/assets/images/Logo.png" />
    <style>
        img {
            max-width: 100%;
        }

        a,
        p {
            color: inherit;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 30px;
            padding: 2rem;
        }

        .grid-item {
            background-color: rgba(var(--background), 0.6);
            border-radius: 20%;
            padding: 50px;
            font-size: 20px;
            text-align: left;
            transition: all 0.5s;
            color: rgba(var(--primary));
        }

        /* TODO: add grid item and grid item p hover */
        .grid-item:hover {
            background-color: rgba(var(--primary));
            color: rgba(var(--primary-foreground));
        }

        /* Large */
        @media screen and (max-width: 1500px) {
            .grid-container {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        /* Medium */
        @media screen and (max-width: 1000px) {
            .grid-container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* Small */
        @media screen and (max-width: 576px) {
            .grid-container {
                grid-template-columns: repeat(1, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <h2 class="neon-text" style="font-size: 2rem; padding: 1.5rem; padding-bottom: 0;">
        Welcome to the world of comfort and elegance <b>Cyber Chair!</b>
    </h2>
    <div class="grid-container">
        <!-- <div class="grid-item">
            <a href="product.html?id=1">
                <img src="assets/images/chair1.png" alt="chair1" />
                <p>CyberLuxe Lounge</p>
                <b>499SAR</b>
            </a>
        </div> -->
    </div>
    <script src="./assets//js/data.js" lang="javascript"></script>
    <script>
        for (let i = 0; i < chairs.length; i++) {
            const chair = chairs[i];
            const gridItem = document.createElement("div");
            gridItem.classList.add("grid-item");
            gridItem.innerHTML = `
                <a href="product.html?id=${chair.id}">
                    <img src="${chair.image}" alt="${chair.name}" />
                    <p>${chair.name}</p>
                    <b>${chair.price}SAR</b>
                </a>
            `;
            document.querySelector(".grid-container").appendChild(gridItem);
        }
    </script>
    <script src="./assets//js/navbar.js" lang="javascript"></script>
    <script src="./assets//js/footer.js" lang="javascript"></script>
</body>

</html>
