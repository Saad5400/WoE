<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="icon" href="/assets/images/Logo.png" />
    <style>
        img {
            max-width: 100%;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 30px;
            padding: 2rem;
        }

        .grid-item {
            background-color: rgba(var(--background), 0.6);
            border-radius: 20%;
            padding: 50px;
            font-size: 20px;
            text-align: left;
            transition: all 0.3s; 
        }

        .grid-item p {
            color: rgba(var(--primary));
            transition: all 0.3s;
        }

        /* TODO: add grid item and grid item p hover */
        .grid-item:hover{
            background-color: rgba(var(--primary));
            text-decoration-color: var(--primary-foreground);
        }

        /* Large */
        @media screen and (max-width: 1500px) {
            .grid-container {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        /* Medium */
        @media screen and (max-width: 1000px) {
            .grid-container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* Small */
        @media screen and (max-width: 576px) {
            .grid-container {
                grid-template-columns: repeat(1, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <script src="./assets//js/navbar.js" lang="javascript"></script>
    <h2 class="neon-text" style="font-size: 2rem; padding: 1.5rem; padding-bottom: 0;">
        مرحبًا بكم في عالم الراحة والأناقة Cyber Chair
    </h2>
    <div class="grid-container">
        <div class="grid-item">
            <a href="product.html?id=1">
                <img src="assets/images/chair1.png" alt="chair1" />
                <p>chair1</p>
                <p>$59.99</p>
            </a>
        </div>
        <div class="grid-item">
            <a href="product.html?id=2">
                <img src="assets/images/chair2.png" alt="chair2" />
                <p>chair2</p>
                <p>$19.99</p>
            </a>
        </div>
        <div class="grid-item">
            <a href="product.html?id=3">
                <img src="assets/images/chair3.png" alt="chair3" />
                <p>chair3</p>
                <p>$69.99</p>
            </a>
        </div>
        <div class="grid-item">
            <a href="product.html?id=4">
                <img src="assets/images/chair4.png" alt="chair4" />
                <p>chair4</p>
                <p>$65.99</p>
            </a>
        </div>
    </div>
    <script src="./assets//js/footer.js" lang="javascript"></script>
</body>

</html>
