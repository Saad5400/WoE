<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message confirmation</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="icon" href="./assets/images/Logo.png" />
    <style>
        span {
            color: rgba(var(--primary));
        }

        h2 {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<!-- // http://127.0.0.1:5500/display.html?firstName=saad&lastName=Batwa&email=s%40s.s&MobileNumber=%2B966536439394&message=fsdfsdf+sdg+sg+dfg+ -->

<body>
    <main class="p-4">
        <h1>
            Thank you for contacting us! We have received your message:
        </h1>
        <h2>
            Name: <span id="name"></span>
        </h2>
        <h2>
            Email: <span id="email"></span>
        </h2>
        <h2>
            Mobile Number: <span id="MobileNumber"></span>
        </h2>
        <h2>
            Message: <span id="message"></span>
        </h2>
    </main>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('firstName') + ' ' + urlParams.get('lastName');
        const email = urlParams.get('email');
        const MobileNumber = urlParams.get('MobileNumber');
        const message = urlParams.get('message');

        document.querySelector('#name').textContent = name;
        document.querySelector('#email').textContent = email;
        document.querySelector('#MobileNumber').textContent = MobileNumber;
        document.querySelector('#message').textContent = message;
    </script>
    <script src="./assets//js/navbar.js" lang="javascript"></script>
    <script src="./assets//js/footer.js" lang="javascript"></script>
</body>

</html>
