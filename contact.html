<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
  <form action="display.html" method="get">

    <style>
      .contact-form {
        max-width: 500px;
        margin: auto;
        padding: 20px;
      }

      .contact-form h1,
      .contact-form p {
        text-align: center;
      }

      .contact-form label {
        display: block;
        margin-top: 10px;
      }

      .contact-form input[type="text"],
      .contact-form input[type="email"],
      .contact-form input[type="MobileNumber"],
      .contact-form textarea {
        color: rgba(var(--foreground));
        background-color: rgba(var(--input));
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-right: -10px;
        border: 1px solid rgba(var(--input-border));
        transition: all 0.3s;
        border-radius: 10px;
      }

      .contact-form input[type="text"]:hover,
      .contact-form input[type="email"]:hover,
      .contact-form textarea:hover {
        background-color: var(--input-hover);
        border-color: var(--input-border-hover);
      }

      .contact-form button {
        background-color: rgba(var(--primary));
        color: rgba(var(--primary-foreground));
        width: 30%;
        padding: 10px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .contact-form button:hover {
        scale: 105%;
      }
    </style>
</head>


<body>
  <script src="./assets//js/navbar.js" lang="javascript"></script>
  <div class="contact-form">
    <h1>
      Contact Us
    </h1>
    <p>
      Fill out the form below to contact us.
    </p>
    <form action="/submit_form" method="post">
      <label for="fullName">
        Full Name*
      </label>
      <div class="name-inputs">
        <input type="text" id="firstName" name="firstName" placeholder="First Name" required />
        <input type="text" id="lastName" name="lastName" placeholder="Last Name" required />
      </div>
      <label for="email">
        Email*
      </label>
      <input pattern="/^[a-zA-Z0-9.!#$%&’*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$/" type="email" id="email"
        name="email" placeholder="Example: example@xyz.com" required />
      <label for="MobileNumber">
        Mobile Number*
      </label>
      <input pattern="^\+9665\d{8}$" type="text" id="MobileNumber" name="MobileNumber"
        placeholder="Example: +9665xxxxxxxx" required />

      <label for="message">
        Message*
      </label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">
        Submit
      </button>
    </form>
  </div>

  <script src="./assets//js/footer.js" lang="javascript"></script>
</body>

</html>
